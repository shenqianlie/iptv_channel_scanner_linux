name: Build iptvscanner

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '填版本号则发 Release，如 v1.0；留空只编译'
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04   # 24.04 已移除 mipsel/armel 交叉工具链，必须用 22.04
    steps:
      - uses: actions/checkout@v4

      - name: 装交叉工具链
        run: |
          sudo apt-get update
          for p in g++-arm-linux-gnueabi g++-mipsel-linux-gnu flex bison wget; do
            echo "安装 $p"
            sudo apt-get install -y "$p" || { echo "!! 装不上：$p"; exit 1; }
          done
          arm-linux-gnueabi-g++ --version | head -1
          mipsel-linux-gnu-g++ --version | head -1

      - name: 编译三个平台
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: iptvscanner-static
          path: |
            iptvscanner-armv7
            iptvscanner-mipsel
            iptvscanner-x86_64

      - name: 取版本号
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 发 Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            iptvscanner-armv7
            iptvscanner-mipsel
            iptvscanner-x86_64
          fail_on_unmatched_files: true
          body: |
            iptvscanner 三平台静态版

            iptvscanner-armv7   ARMv7，HS8145X6 / Cortex-A9
            iptvscanner-mipsel  MIPS32r2，MT7621A / MT7620
            iptvscanner-x86_64  x86_64 软路由

            用法：./iptvscanner-xxx 239.3.1.1 239.3.1.254（需 root）
