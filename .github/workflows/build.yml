name: Build iptvscanner

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'release tag, e.g. v1.0 (empty = build only)'
        default: ''

jobs:

  build-arm-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install-toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabi g++-aarch64-linux-gnu g++-mingw-w64-x86-64 flex bison wget unzip
      - name: build
        run: '[ -f build.sh ] || { echo "repo root missing build.sh"; ls -la; exit 1; }; TARGETS="armv7 aarch64 win" bash build.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: arm-x86
          path: iptvscanner*

  build-mips:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install-toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mipsel-linux-gnu flex bison wget
      - name: build
        run: '[ -f build.sh ] || { echo "repo root missing build.sh"; ls -la; exit 1; }; TARGETS=mipsel bash build.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: mips
          path: iptvscanner*

  release:
    needs: [ build-arm-x86, build-mips ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list
        run: ls -lh dist && file dist/*
      - name: tag
        id: tag
        run: 'TAG="${GITHUB_REF#refs/tags/}"; [[ "${GITHUB_REF}" == refs/tags/v* ]] || TAG="${{ inputs.release_tag }}"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"'
      - name: release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/iptvscanner*
          fail_on_unmatched_files: true
