name: Build HS8145X6 iptvscanner MUSL STATIC vfpv3-d16

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          wget https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf zig-linux-x86_64-0.13.0.tar.xz
          mv zig-linux-x86_64-0.13.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH
          zig version

      - name: Download libpcap 1.10.4
        run: |
          wget https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz
          tar -zxf libpcap-1.10.4.tar.gz
          cd libpcap-1.10.4
          ./configure \
            --host=arm-linux-musleabihf \
            --build=x86_64-pc-linux-gnu \
            --disable-shared \
            --enable-static \
            --disable-usb \
            --disable-bluetooth \
            --disable-netmap \
            --disable-dbus \
            --disable-rdma \
            --without-libnl \
            --prefix=${PWD}/install \
            CC="zig cc -target arm-linux-musleabihf -mcpu=cortex-a9+vfpv3-d16"
          make -j$(nproc)
          make install
          ls -la install/lib/
          test -f install/lib/libpcap.a || exit 1
          cd ..
          ls -la

      - name: Compile main.cpp -> iptvscanner
        run: |
          ls -la
          test -f main.cpp || exit 1
          zig c++ \
            -target arm-linux-musleabihf \
            -mcpu=cortex-a9+vfpv3-d16 \
            -O2 -std=c++17 \
            -I./libpcap-1.10.4/install/include \
            -L./libpcap-1.10.4/install/lib \
            main.cpp -o iptvscanner \
            -lpcap -lpthread -lm -static
          ls -la
          test -f iptvscanner || { echo ">>>> 编译成功但是没有生成 iptvscanner !"; exit 1; }
          file iptvscanner

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvscanner-musl-static
          path: iptvscanner

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iptvscanner
          fail_on_unmatched_files: true
          name: Release ${{ github.ref_name }}
          body: |
            iptvscanner for HS8145X6
            ✅ arm-linux-musleabihf
            ✅ cortex-a9 + vfpv3-d16 (OpenWrt标准)
            ✅ Fully static, no libc dependency
          draft: false
          prerelease: false
