name: Build HS8145X6 (Cortex-A9 armv7-hf)

on:
  push:
    branches: [ main ]
  tags:
    - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install armhf cross compiler
        run: |
          sudo apt update
          sudo apt install -y g++-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Compile (单cpp文件 main.cpp)
        run: |
          arm-linux-gnueabihf-g++ \
            -mcpu=cortex-a9 \
            -mfpu=neon-vfpv3 \
            -mfloat-abi=hard \
            -O2 -std=c++17 -static \
            main.cpp -o hs8145x6_app

      - name: Upload 产物（Actions下载）
        uses: actions/upload-artifact@v4
        with:
          name: hs8145x6_app
          path: hs8145x6_app

      - name: Create Release & Upload Binary（仅tag触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hs8145x6_app
