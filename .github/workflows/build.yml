name: Build HS8145X6 iptvscanner (ARMv7 integer-only / static)

# 缺这段 GITHUB_TOKEN 只读，Release 会是空的
permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '填写则创建 Release 并上传文件，例如 v1.0（留空只编译不发布）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install armel toolchain（软浮点/整数版）
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabi flex bison wget
          arm-linux-gnueabi-g++ --version | head -1

      - name: Fetch libpcap 1.10.4 source
        run: |
          wget -q https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz
          tar -zxf libpcap-1.10.4.tar.gz

      - name: Build libpcap static (soft-float)
        run: |
          cd libpcap-1.10.4
          ./configure \
            --host=arm-linux-gnueabi \
            --build=x86_64-pc-linux-gnu \
            --disable-shared \
            --disable-usb \
            --disable-bluetooth \
            --disable-netmap \
            --disable-dbus \
            --disable-rdma \
            --without-libnl \
            --prefix=$PWD/install \
            CC=arm-linux-gnueabi-gcc \
            CFLAGS="-O2 -march=armv7-a -mfloat-abi=soft"
          make -j$(nproc)
          make install
          test -f install/lib/libpcap.a

      - name: Compile iptvscanner（纯整数指令）
        run: |
          arm-linux-gnueabi-g++ \
            -march=armv7-a \
            -mfloat-abi=soft \
            -O2 -std=c++17 \
            -I./libpcap-1.10.4/install/include \
            -L./libpcap-1.10.4/install/lib \
            iptvscanner.cpp -o iptvscanner \
            -lpcap -lpthread -lm -static

          ls -lh iptvscanner
          file iptvscanner
          file iptvscanner | grep -q "statically linked" || { echo "不是静态链接，会报 not found"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvscanner-armv7-static
          path: iptvscanner

      # 统一的“本次要不要发 Release”判断：push tag，或手动填了 release_tag
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "本次发布标签 = [$TAG]"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 发布前确认（看日志用）
        if: steps.tag.outputs.tag != ''
        run: |
          ls -lh iptvscanner
          sha256sum iptvscanner

      - name: Create Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            iptvscanner
          fail_on_unmatched_files: true
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            iptvscanner for HS8145X6 (Cortex-A9 / ARMv7)

            - 纯整数指令（soft-float，无 VFP / NEON 依赖，不会 Illegal instruction）
            - fully static，不依赖路由器任何 so，不会 not found

            用法：./iptvscanner 239.3.1.1 239.3.1.254（需 root）
          draft: false
          prerelease: false
