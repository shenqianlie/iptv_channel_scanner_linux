name: Build HS8145X6 (Cortex-A9 armv7hf single cpp)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross compiler + armhf libpcap
        run: |
          sudo apt update
          sudo dpkg --add-architecture armhf
          sudo apt install -y g++-arm-linux-gnueabihf libc6-dev-armhf-cross libpcap-dev:armhf

      - name: Compile main.cpp (link -lpcap)
        run: |
          arm-linux-gnueabihf-g++ \
            -mcpu=cortex-a9 \
            -mfpu=neon-vfpv3 \
            -mfloat-abi=hard \
            -O2 -std=c++17 -static \
            main.cpp -o hs8145x6_app -lpcap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hs8145x6_app
          path: hs8145x6_app
