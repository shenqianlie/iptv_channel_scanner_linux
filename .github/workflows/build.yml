name: Build iptvscanner (ARMv7 / MIPS MT7621A, static)

# 缺这段 GITHUB_TOKEN 只读，Release 会是空的
permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '填写则创建 Release 并上传文件，例如 v1.0（留空只编译不发布）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchains（ARMv7 armel + MIPS mipsel）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-arm-linux-gnueabi \
            g++-mipsel-linux-gnu \
            flex bison wget
          arm-linux-gnueabi-g++ --version | head -1
          mipsel-linux-gnu-g++ --version | head -1

      - name: Fetch libpcap 1.10.4 source
        run: |
          wget -q https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz
          tar -zxf libpcap-1.10.4.tar.gz
- name: Build libpcap static (ARMv7, soft-float)
        run: |
          cp -a libpcap-1.10.4 libpcap-arm
          cd libpcap-arm
          ./configure \
            --host=arm-linux-gnueabi \
            --build=x86_64-pc-linux-gnu \
            --disable-shared \
            --disable-usb \
            --disable-bluetooth \
            --disable-netmap \
            --disable-dbus \
            --disable-rdma \
            --without-libnl \
            --prefix=$PWD/install \
            CC=arm-linux-gnueabi-gcc \
            CFLAGS="-O2 -march=armv7-a -mfloat-abi=soft"
          make -j$(nproc)
          make install
          test -f install/lib/libpcap.a

      - name: Build libpcap static (MIPS mipsel, mips32r2)
        run: |
          cp -a libpcap-1.10.4 libpcap-mips
          cd libpcap-mips
          ./configure \
            --host=mipsel-linux-gnu \
            --build=x86_64-pc-linux-gnu \
            --disable-shared \
            --disable-usb \
            --disable-bluetooth \
--disable-netmap \
            --disable-dbus \
            --disable-rdma \
            --without-libnl \
            --prefix=$PWD/install \
            CC=mipsel-linux-gnu-gcc \
            CFLAGS="-O2 -march=mips32r2"
          make -j$(nproc)
          make install
          test -f install/lib/libpcap.a

      - name: Build libpcap static (x86_64 原生)
        run: |
          cp -a libpcap-1.10.4 libpcap-x64
          cd libpcap-x64
          ./configure \
            --disable-shared \
            --disable-usb \
            --disable-bluetooth \
            --disable-netmap \
            --disable-dbus \
            --disable-rdma \
            --without-libnl \
            --prefix=$PWD/install
          make -j$(nproc)
          make install
          test -f install/lib/libpcap.a

      - name: Compile ARMv7（HS8145X6 / Cortex-A9，纯整数）
        run: |
          arm-linux-gnueabi-g++ \
            -march=armv7-a \
            -mfloat-abi=soft \
            -O2 -std=c++17 \
-I./libpcap-arm/install/include \
            -L./libpcap-arm/install/lib \
            iptvscanner.cpp -o iptvscanner-armv7 \
            -lpcap -lpthread -lm -static

          file iptvscanner-armv7
          file iptvscanner-armv7 | grep -q "statically linked" || { echo "armv7 不是静态链接"; exit 1; }

      - name: Compile MIPS（MT7621A，mips32r2 小端）
        run: |
          mipsel-linux-gnu-g++ \
            -march=mips32r2 \
            -mtune=24kc \
            -O2 -std=c++17 \
            -I./libpcap-mips/install/include \
            -L./libpcap-mips/install/lib \
            iptvscanner.cpp -o iptvscanner-mipsel \
            -lpcap -lpthread -lm -static

          file iptvscanner-mipsel
          file iptvscanner-mipsel | grep -q "statically linked" || { echo "mipsel 不是静态链接"; exit 1; }

      - name: Compile x86_64（软路由 / OpenWrt x86）
        run: |
          g++ \
            -O2 -std=c++17 \
            -I./libpcap-x64/install/include \
            -L./libpcap-x64/install/lib \
iptvscanner.cpp -o iptvscanner-x86_64 \
            -lpcap -lpthread -lm -static

          file iptvscanner-x86_64
          file iptvscanner-x86_64 | grep -q "statically linked" || { echo "x86_64 不是静态链接"; exit 1; }

          ls -lh iptvscanner-armv7 iptvscanner-mipsel iptvscanner-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptvscanner-static
          path: |
            iptvscanner-armv7
            iptvscanner-mipsel
            iptvscanner-x86_64

      # 统一的“本次要不要发 Release”判断：push tag，或手动填了 release_tag
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "本次发布标签 = [$TAG]"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 发布前确认（看日志用）
        if: steps.tag.outputs.tag != ''
        run: |
          ls -lh iptvscanner-armv7 iptvscanner-mipsel iptvscanner-x86_64
          sha256sum iptvscanner-armv7 iptvscanner-mipsel iptvscanner-x86_64

      - name: Create Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            iptvscanner-armv7
            iptvscanner-mipsel
            iptvscanner-x86_64
          fail_on_unmatched_files: true
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            iptvscanner（IPTV 组播扫描），两个平台，都是 fully static

            - iptvscanner-armv7  : ARMv7，纯整数指令（HS8145X6 / Cortex-A9 等）
            - iptvscanner-mipsel : MIPS32r2 小端（MT7621A / MT7620 等 MTK 路由器）
            - iptvscanner-x86_64 : x86_64 软路由 / OpenWrt x86 平台

            不依赖设备上的任何 so，不会 Illegal instruction / not found

            用法：./iptvscanner-armv7 239.3.1.1 239.3.1.254（需 root）
          draft: false
          prerelease: false
