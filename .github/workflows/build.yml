name: Build HS8145X6 iptvscanner STATIC (musl safe)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross compiler & build tools
        run: |
          sudo apt update
          sudo apt install -y g++-arm-linux-gnueabihf flex bison wget tar
          ls -la

      - name: Download & build libpcap 1.10.4 static
        run: |
          wget https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz
          tar -zxf libpcap-1.10.4.tar.gz
          cd libpcap-1.10.4
          ./configure \
            --host=arm-linux-gnueabihf \
            --build=x86_64-pc-linux-gnu \
            --disable-shared \
            --enable-static \
            --disable-usb \
            --disable-bluetooth \
            --disable-netmap \
            --disable-dbus \
            --disable-rdma \
            --without-libnl \
            --prefix=${PWD}/install \
            CC=arm-linux-gnueabihf-gcc
          make -j$(nproc)
          make install
          ls -la install/lib/
          test -f install/lib/libpcap.a || exit 1
          cd ..
          ls -la

      - name: Compile main.cpp -> iptvscanner FULL STATIC
        run: |
          ls -la
          test -f main.cpp || exit 1
          arm-linux-gnueabihf-g++ \
            -mcpu=cortex-a9 \
            -mfpu=vfpv3 \
            -mfloat-abi=hard \
            -O2 -std=c++17 \
            -I./libpcap-1.10.4/install/include \
            -L./libpcap-1.10.4/install/lib \
            main.cpp -o iptvscanner \
            -lpcap -lpthread -lm -static
          ls -la
          test -f iptvscanner || { echo ">>>> 编译成功但是没有生成 iptvscanner !"; exit 1; }
          # 打印二进制信息，方便核对
          arm-linux-gnueabihf-readelf -l iptvscanner || true
          arm-linux-gnueabihf-file iptvscanner

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvscanner-static
          path: iptvscanner

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iptvscanner
          fail_on_unmatched_files: true
          name: Release ${{ github.ref_name }}
          body: |
            iptvscanner for HS8145X6
            Cortex-A9, vfpv3 (NO NEON)
            ✅ Fully static build (glibc-static)
            ✅ No dependency on router libpcap / musl ld
          draft: false
          prerelease: false
