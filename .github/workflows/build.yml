name: Build HS8145X6 iptvscanner (Cortex-A9 armv7hf + libpcap static)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross compiler & cmake
        run: |
          sudo apt update
          sudo apt install -y g++-arm-linux-gnueabihf cmake wget tar

      - name: Download & build libpcap 1.10.4 static armhf
        run: |
          wget https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz
          tar -zxf libpcap-1.10.4.tar.gz
          cd libpcap-1.10.4
          mkdir build && cd build
          cmake .. \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_INSTALL_PREFIX=${PWD}/install \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_REMOTE=OFF \
            -DDISABLE_DBUS=ON
          make -j$(nproc)
          make install
          cd ../../

      - name: Compile iptvscanner.cpp
        run: |
          arm-linux-gnueabihf-g++ \
            -mcpu=cortex-a9 \
            -mfpu=neon-vfpv3 \
            -mfloat-abi=hard \
            -O2 -std=c++17 -static \
            -I./libpcap-1.10.4/build/install/include \
            -L./libpcap-1.10.4/build/install/lib \
            iptvscanner.cpp -o iptvscanner -lpcap

      - name: Upload artifact（Actions下载）
        uses: actions/upload-artifact@v4
        with:
          name: iptvscanner
          path: iptvscanner

      - name: Release & upload binary（仅tag触发 v*）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iptvscanner
          fail_on_unmatched_files: true
          name: Release ${{ github.ref_name }}
          body: |
            iptvscanner for HS8145X6 (Cortex-A9 armv7hf static)
          draft: false
          prerelease: false
